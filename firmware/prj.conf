# Phase 1A/1B + Phase 2 + Phase 3: base + BLE + MCUboot Direct-XIP OTA + LED3 PWM + QSPI LittleFS + PDM0/CMSIS-DSP

# ---- 1. Peripherals, watchdog, logging ----
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PM_DEVICE=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# Keep HW fallback WDT >= 1500 ms (1000 + 500) so NVMC/MPSL never trips the default 120 ms window
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=500
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# DK_LIBRARY must stay OFF: it would drive P0.15 (led2) as GPIO and clash with PWM0.
CONFIG_DK_LIBRARY=n

CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# ---- 2. Bluetooth ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BLEAudio_DK"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=650
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_BUF_ACL_TX_COUNT=12
# Must exceed ACL TX count (static assert; missing from the spec's list)
CONFIG_BT_BUF_EVT_RX_COUNT=14
# L2CAP dynamic channels (CoC) depend on BT_SMP (missing from the spec's list)
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_ECRED=n
CONFIG_BT_GATT_DYNAMIC_DB=y

# ---- 3. MCUboot Direct-XIP + Revert, BLE OTA (MCUmgr SMP) ----
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_REBOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=n
CONFIG_MCUMGR_GRP_IMG=y
# Prerequisite of the *_HOOK options below (missing from the spec's list)
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_IMG_REJECT_DIRECT_XIP_MISMATCHED_SLOT=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
# Keep MCUmgr below sys_mgr_task (prio 8) so task_wdt is never starved during OTA
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=9
# Slice 4 KB internal flash erase (~90 ms) into 3 ms steps so BLE/timers/WDT stay responsive
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE_MS=3

# ---- 4. Phase 1B: GATT client (MTU exchange), CTS client, L2CAP CoC ----
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_CTS_CLIENT=y

# ---- 5. Phase 2: external QSPI (MX25R64) + LittleFS + NVS settings ----
# Partition layout uses native DTS (flash0 storage_partition for NVS, mx25r64 lfs_partition for LittleFS).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Names are boot_<u32>_<u16>.pcm / <u32>_<n>.pcm (< 32 B): keeps struct fs_dirent small
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=32
CONFIG_FS_LITTLEFS_NUM_FILES=2
CONFIG_FS_LITTLEFS_NUM_DIRS=2
CONFIG_FS_LITTLEFS_READ_SIZE=16
CONFIG_FS_LITTLEFS_PROG_SIZE=16
# Align LittleFS cache to the 4 KB page/block size so 4 KB writes don't split 8 ways
CONFIG_FS_LITTLEFS_CACHE_SIZE=4096
# 256 B bitmap (2048 bits) tracks all 2048 x 4 KB blocks in a single allocation pass
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=256
CONFIG_FS_LITTLEFS_BLOCK_CYCLES=512

# boot_cnt lives in NVS (internal flash storage_partition)
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y