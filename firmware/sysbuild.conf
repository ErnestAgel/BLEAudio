# MCUboot + Direct-XIP with Revert (BLE-AUDIO-MOD-OTA-003 §2.1)
# Partition layout uses native DTS partitioning (nrf52840_partition.dtsi + board overlay).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_DIRECT_XIP_WITH_REVERT=y

# Dev: NCS default test key. Production: replace with own ECDSA-P256 key.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="keys/mcuboot_ecdsa_p256.pem"
